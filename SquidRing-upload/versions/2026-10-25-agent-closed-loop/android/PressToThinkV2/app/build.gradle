plugins { id 'com.android.application' }

android {
    namespace 'com.presstothink.v2'
    compileSdk 36

    defaultConfig {
        applicationId 'com.presstothink.v2'
        minSdk 26
        targetSdk 35
        versionCode 30000
        versionName '3.0.0-dev'
        testInstrumentationRunner 'com.presstothink.v2.EngineInstrumentation'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
